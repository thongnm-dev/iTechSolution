<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="iTechSolution — Giải pháp công nghệ cho doanh nghiệp. Phát triển web, ứng dụng di động, backend API và triển khai cloud." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://videos.pexels.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://videos.pexels.com" crossorigin />
    <title>iTechSolution</title>
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #preloader.hide {
        opacity: 0;
        visibility: hidden;
      }
      #preloader .logo {
        font-weight: 800;
        font-size: 24px;
        background: linear-gradient(135deg, #4f46e5 30%, #f59e0b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #preloader .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e5e7eb;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        #preloader { background: #0f0d1a; }
        #preloader .spinner { border-color: #374151; border-top-color: #818cf8; }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="logo">iTechSolution</div>
      <div class="spinner"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
