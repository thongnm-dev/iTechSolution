name: itechsolution

services:
  app:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: itechsolution-app:latest
    container_name: itechsolution-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      APP_NAME: ${APP_NAME:-iTechSolution}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5434}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
    volumes:
      - storage-data:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  postgres:
    image: postgres:18-alpine
    container_name: itechsolution-postgres
    restart: unless-stopped
    # Run Postgres on DB_PORT so the same port is used internally and on the host.
    command: -p ${DB_PORT:-5434}
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5434}:${DB_PORT:-5434}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel} -p ${DB_PORT:-5434}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

volumes:
  postgres-data:
  storage-data:

networks:
  app:
    driver: bridge
