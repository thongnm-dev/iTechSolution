server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.html;
    charset utf-8;

    client_max_body_size 20m;

    # Laravel API
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    # Filament admin panel
    location ^~ /admin {
        try_files $uri /index.php?$query_string;
    }

    # Livewire (used by Filament) asset/update endpoints
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    # Laravel public storage (uploaded files)
    location ^~ /storage/ {
        try_files $uri =404;
    }

    # Static assets published by Laravel/Filament
    location ~ ^/(css|js|fonts|images)/ {
        try_files $uri =404;
    }

    # Frontend build assets (Vite output)
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # Everything else: Vue SPA (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
